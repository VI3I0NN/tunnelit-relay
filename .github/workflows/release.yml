name: Build and Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare Binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/tunnelit-relay dist/tunnelit-relay-linux-amd64
          chmod +x dist/tunnelit-relay-linux-amd64

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Precompiled Release"
          files: dist/tunnelit-relay-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
