<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunnelit Relay Admin</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1, h2 { color: #ffffff; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; background-color: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #2c2c2c; font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        button { background-color: #4CAF50; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        button.reject { background-color: #f44336; }
        button.delete { background-color: #ff9800; }
        .container { max-width: 1200px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tunnelit Relay Admin</h1>
        
        <h2>Active Tunnels</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Protocol</th>
                    <th>Local Port</th>
                    <th>Public Port</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tunnels-body">
            </tbody>
        </table>

        <h2>Subdomain Requests</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tunnel ID</th>
                    <th>Desired Name</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="requests-body">
            </tbody>
        </table>
    </div>

    <script>
        async function fetchTunnels() {
            const res = await fetch('/api/tunnels');
            const data = await res.json();
            const tbody = document.getElementById('tunnels-body');
            tbody.innerHTML = '';
            data.forEach(t => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${t.id.substring(0, 8)}...</td>
                    <td>${t.protocol.toUpperCase()}</td>
                    <td>${t.local_port}</td>
                    <td>${t.public_port}</td>
                    <td>${new Date(t.created_at * 1000).toLocaleString()}</td>
                    <td>
                        <button class="delete" onclick="deleteTunnel('${t.id}')">Close</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function fetchRequests() {
            const res = await fetch('/api/requests');
            const data = await res.json();
            const tbody = document.getElementById('requests-body');
            tbody.innerHTML = '';
            data.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r.id.substring(0, 8)}...</td>
                    <td>${r.tunnel_id.substring(0, 8)}...</td>
                    <td>${r.desired_name}</td>
                    <td>${r.status}</td>
                    <td>
                        ${r.status === 'pending' ? `
                            <button onclick="approveRequest('${r.id}')">Approve</button>
                            <button class="reject" onclick="rejectRequest('${r.id}')">Reject</button>
                        ` : '-'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteTunnel(id) {
            if(confirm('Close this tunnel?')) {
                await fetch(`/api/tunnels/${id}`, { method: 'DELETE' });
                fetchTunnels();
            }
        }

        async function approveRequest(id) {
            const name = prompt("Confirm subdomain name:", "");
            if (name) {
                await fetch(`/api/requests/${id}/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subdomain: name })
                });
                fetchRequests();
            }
        }

        async function rejectRequest(id) {
            if(confirm('Reject this request?')) {
                await fetch(`/api/requests/${id}/reject`, { method: 'POST' });
                fetchRequests();
            }
        }

        function refreshData() {
            fetchTunnels();
            fetchRequests();
        }

        refreshData();
        setInterval(refreshData, 5000);
    </script>
</body>
</html>
